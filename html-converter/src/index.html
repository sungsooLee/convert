<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>HTML → React/Vue TS Converter</title>

    <style>
      body {
        font-family: sans-serif;
        background: #f5f5f5;
        padding: 30px;
      }

      .converter-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .code-textarea {
        width: 100%;
        height: 220px;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-family: monospace;
      }

      .output-box {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #ddd;
      }

      .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e293b;
        color: #fff;
        padding: 10px 15px;
      }

      .code-block {
        padding: 20px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 13px;
      }

      .btn-convert,
      .btn-copy {
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
      }

      .btn-convert {
        width: 100%;
        margin: 20px 0;
      }
    </style>
  </head>

  <body>
    <h1>HTML → React / Vue TS Converter</h1>

    <textarea id="htmlInput" class="code-textarea" placeholder="HTML 입력">
<ul class="list">
  <li>사과</li>
  <li>바나나</li>
  <li>오렌지</li>
</ul>
    </textarea>

    <button class="btn-convert" onclick="processConvert()">변환하기</button>

    <div class="converter-wrap">
      <div class="output-box">
        <div class="output-header">
          <span>React TSX</span>
          <button class="btn-copy" onclick="copyCode('reactOutput')">
            Copy
          </button>
        </div>

        <pre id="reactOutput" class="code-block"></pre>
      </div>

      <div class="output-box">
        <div class="output-header">
          <span>Vue 3 TS</span>
          <button class="btn-copy" onclick="copyCode('vueOutput')">Copy</button>
        </div>

        <pre id="vueOutput" class="code-block"></pre>
      </div>
    </div>

    <script>
      // -----------------------------
      // HTML Attribute → React
      // -----------------------------
      function convertReactAttr(name) {
        const map = {
          class: "className",
          for: "htmlFor",
          onclick: "onClick",
          onchange: "onChange",
        };

        return map[name] || name;
      }

      // -----------------------------
      // React Props Type
      // -----------------------------
      function getReactPropsType(tag) {
        const map = {
          button: "ButtonHTMLAttributes<HTMLButtonElement>",
          input: "InputHTMLAttributes<HTMLInputElement>",
          textarea: "TextareaHTMLAttributes<HTMLTextAreaElement>",
          form: "FormHTMLAttributes<HTMLFormElement>",
          select: "SelectHTMLAttributes<HTMLSelectElement>",
        };

        return map[tag] || "HTMLAttributes<HTMLElement>";
      }

      // -----------------------------
      // LIST DETECT
      // -----------------------------
      function detectList(el) {
        if (el.tagName.toLowerCase() !== "ul") return null;

        const children = [...el.children];

        const isAllLi = children.every(
          (child) => child.tagName.toLowerCase() === "li",
        );

        if (!isAllLi) return null;

        return children.map((li) => li.textContent.trim());
      }

      // -----------------------------
      // JSX ATTR
      // -----------------------------
      function buildReactAttrs(el) {
        return [...el.attributes]
          .map((attr) => {
            const name = convertReactAttr(attr.name);
            return `${name}="${attr.value}"`;
          })
          .join("\n      ");
      }

      // -----------------------------
      // REACT GENERATOR
      // -----------------------------
      function generateReact(el) {
        const tag = el.tagName.toLowerCase();

        const propsType = getReactPropsType(tag);

        const listData = detectList(el);

        // -----------------------------
        // LIST
        // -----------------------------
        if (listData) {
          return `
import React from 'react';

interface Props {
  items?: string[];
}

const CustomComponent: React.FC<Props> = ({
  items = ${JSON.stringify(listData, null, 2)}
}) => {
  return (
    <ul className="list">
      {items.map((item, idx) => (
        <li key={idx}>{item}</li>
      ))}
    </ul>
  );
};

export default CustomComponent;
`;
        }

        // -----------------------------
        // NORMAL
        // -----------------------------
        const attrs = buildReactAttrs(el);

        return `
import React, {
  ReactNode,
  ${propsType}
} from 'react';

interface Props extends ${propsType} {
  children?: ReactNode;
}

const CustomComponent: React.FC<Props> = ({
  children,
  ...props
}) => {
  return (
    <${tag}
      ${attrs}
      {...props}
    >
      {children || '${el.innerHTML.trim()}'}
    </${tag}>
  );
};

export default CustomComponent;
`;
      }

      // -----------------------------
      // VUE GENERATOR
      // -----------------------------
      function generateVue(el) {
        const tag = el.tagName.toLowerCase();

        const listData = detectList(el);

        // -----------------------------
        // LIST
        // -----------------------------
        if (listData) {
          return `
<script setup lang="ts">
interface Props {
  items?: string[];
}

withDefaults(defineProps<Props>(), {
  items: () => (${JSON.stringify(listData, null, 2)})
});
<\/script>

<template>
  <ul class="list">
    <li
      v-for="(item, idx) in items"
      :key="idx"
    >
      {{ item }}
    </li>
  </ul>
</template>
`;
        }

        // -----------------------------
        // ATTRIBUTES
        // -----------------------------
        const attrs = [...el.attributes]
          .map((attr) => `${attr.name}="${attr.value}"`)
          .join("\n    ");

        return `
<script setup lang="ts">
interface Props {}

defineProps<Props>();
<\/script>

<template>
  <${tag}
    ${attrs}
    v-bind="$attrs"
  >
    <slot>${el.innerHTML.trim()}</slot>
  </${tag}>
</template>
`;
      }

      // -----------------------------
      // MAIN
      // -----------------------------
      function processConvert() {
        const html = document.getElementById("htmlInput").value.trim();

        if (!html) return;

        const parser = new DOMParser();

        const doc = parser.parseFromString(html, "text/html");

        const el = doc.body.firstElementChild;

        if (!el) return;

        const reactCode = generateReact(el);

        const vueCode = generateVue(el);

        document.getElementById("reactOutput").innerText = reactCode.trim();

        document.getElementById("vueOutput").innerText = vueCode.trim();
      }

      // -----------------------------
      // COPY
      // -----------------------------
      function copyCode(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);

        alert("복사되었습니다.");
      }

      window.onload = processConvert;
    </script>
  </body>
</html>
